<!DOCTYPE html>
<html lang="fr">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Smart Stream TV</title>
        <link rel="icon" type="image/svg+xml" href="smart-stream-icon.svg">
        <link rel="stylesheet" href="css/output.css">
    </head>
    <body class="bg-[#0B1530] md:h-screen md:flex md:flex-col md:overflow-hidden">
        <header class="bg-[#0B1530] text-white p-4 flex justify-between items-center shadow-md border-b border-[#2F6FED]/30 sticky top-0 z-50">

            <div class="flex items-center gap-2 sm:gap-3">
                <img src="smart-stream-logo.svg" alt="Logo de Smart Stream" class="h-10 w-auto">
                <h1 class="text-base sm:text-xl font-bold tracking-wide">
                    Smart Stream <span class="text-[#FCC62D]">TV</span>
                </h1>
            </div>

            <nav>
                <ul class="flex items-center gap-3 sm:gap-6 text-xs sm:text-sm text-gray-300">
                    <li><a href="#" class="hover:text-[#FCC62D] transition-colors">Accueil</a></li>
                    <li><a href="#channel-list" class="hover:text-[#FCC62D] transition-colors">Chaînes</a></li>
                    <li class="hidden sm:block"><a href="#" class="hover:text-[#FCC62D] transition-colors">À propos</a></li>
                </ul>
            </nav>

        </header>

        <main class="flex flex-col md:flex-row md:flex-1 md:overflow-hidden">

            <aside class="w-full md:w-80 bg-[#0B1530]/50 border-t md:border-t-0 md:border-r border-[#2F6FED]/30 order-2 md:order-1 flex flex-col md:h-full">

                <div class="p-4 border-b border-[#2F6FED]/30">
                    <h2 class="text-white font-bold text-lg uppercase tracking-wider">Liste des chaînes</h2>
                </div>

                <div class="p-3 border-b border-[#2F6FED]/30">

                    <div class="relative">

                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                            <svg class="h-4 w-4 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
                            </svg>
                        </div>

                        <input type="text" id="search-input" placeholder="Rechercher une chaîne..." class="w-full bg-[#0B1530] text-white text-sm rounded-lg pl-10 pr-4 py-2 border border-[#2F6FED]/30 focus:outline-none focus:border-[#2F6FED] focus:ring-1 focus:ring-[#2F6FED] placeholder-gray-500">

                    </div>
                </div>

                <div id="channel-list" class="flex-1 overflow-y-auto p-2 space-y-2">

                </div>
            </aside>

            <section class="flex-1 p-4 md:p-8 order-1 md:order-2 md:overflow-y-auto">

                <div class="relative w-full aspect-video bg-black rounded-lg overflow-hidden shadow-lg border border-[#2F6FED]/30">

                    <img id="preview-image" alt="Prévisualisation de la chaîne" class="w-full h-full object-cover">

                    <div class="absolute bottom-0 left-0 w-full p-4 bg-linear-to-t from-black/80 to-transparent">

                        <h2 id="preview-title" class="text-white text-2xl font-bold"></h2>

                        <p id="preview-category" class="text-[#FCC62D] font-semibold text-sm"></p>
                    </div>
                </div>

                <div class="mt-4 text-white">

                    <h3 class="text-lg font-semibold border-b border-[#2F6FED]/50 pb-2 mb-2">En cours de diffusion</h3>

                    <!-- Conteneur des infos du programme -->
                    <div id="program-info" class="bg-[#0B1530]/30 p-4 rounded-lg border border-[#2F6FED]/20">
                        <div class="flex justify-between items-center mb-2">
                            <span id="program-title" class="text-[#FCC62D] font-bold text-lg">Chargement...</span>
                            <span id="program-time" class="text-gray-400 text-sm">--:-- - --:--</span>
                        </div>
                        
                        <!-- Barre de progression -->
                        <div class="w-full bg-gray-700 rounded-full h-2.5">
                            <div id="program-progress" class="bg-[#F04438] h-2.5 rounded-full w-0"></div>
                        </div>
                        
                        <p class="text-gray-400 text-xs mt-3">
                            <span class="text-gray-300 font-medium">Smart Stream TV</span> - Profitez de votre programme en direct.
                        </p>
                    </div>

                </div>

            </section>

        </main>

        <footer class="bg-[#0B1530] shrink-0 text-center p-4 text-xs text-gray-500 border-t border-[#2F6FED]/30">
            &copy; 2026 Smart Stream TV - Tous droits réservés
        </footer>

        <script type="module" src="js/app.js"></script>
    </body>
</html>
